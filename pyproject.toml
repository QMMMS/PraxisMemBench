[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "praxismembench"
version = "0.1.0"
description = "Persistent personal and procedural memory evaluation and PraxisMem training"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "numpy>=1.26", "openai>=1.0", "mcp>=1.0,<2", "certifi", "huggingface-hub>=0.25"]

[project.optional-dependencies]
mem0 = ["mem0ai==2.0.7"]
dualmem = ["mem0ai==2.0.7"]
zep = ["graphiti-core==0.29.2"]
memos = ["MemoryOS==2.0.30"]
claude-code = ["claude-agent-sdk==0.2.128"]
training = ["torch>=2.6", "pandas>=2.2", "pyarrow>=16", "scipy>=1.12", "transformers>=4.51", "omegaconf>=2.3"]

[project.scripts]
pmb = "praxismembench.cli:main"
praxismem = "praxismem.training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"praxismembench.evaluation" = ["*.yaml"]
"praxismembench.harnesses" = ["*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
